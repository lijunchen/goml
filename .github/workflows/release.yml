name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: extractions/setup-just@v2
        with:
          just-version: '1.40.0'
      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          release_version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$release_version"
          bash tools/release/release.sh check-version "$release_version"
          ci_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --branch main \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 1 \
            --json status,conclusion,url \
            --jq 'if length == 0 then "" else .[0] | "\(.status)|\(.conclusion)|\(.url)" end')"
          if test -z "$ci_run"; then
            echo "main CI run not found for $GITHUB_SHA" >&2
            exit 1
          fi
          IFS='|' read -r ci_status ci_conclusion ci_url <<< "$ci_run"
          if test "$ci_status" != "completed" || test "$ci_conclusion" != "success"; then
            echo "main CI has not succeeded for $GITHUB_SHA: $ci_status $ci_conclusion $ci_url" >&2
            exit 1
          fi
          release_tags="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[].tagName')"
          previous_tag="$(bash tools/release/release.sh latest $release_tags)"
          previous_version="${previous_tag#v}"
          bash tools/release/release.sh check-next "$previous_version" "$release_version"
          bash tools/release/release.sh check-stage0 "$previous_version"
          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2>/dev/null || true)"
          test "$release_state" != "false"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
      - name: Build stage2
        run: just make
      - name: Build release archive
        run: |
          set -euo pipefail
          package="goml-${RELEASE_VERSION}-linux-amd64"
          mkdir -p "dist/$package/bin"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "dist/$package/bin/goml" goml/_bootstrap/stage2/build/pkg/gomlang/bootstrap_goml/cmd/goml/goml_generated.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "dist/$package/bin/gomlc" gomlc/_bootstrap/stage2/build/pkg/gomlc/cmd/gomlc/goml_generated.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "dist/$package/bin/gomlfmt" gomlc/_bootstrap/stage2/build/pkg/gomlc/cmd/gomlfmt/goml_generated.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "dist/$package/bin/gomllsp" gomlc/_bootstrap/stage2/build/pkg/gomlc/cmd/gomllsp/goml_generated.go
          bash tools/lib/install.sh "dist/$package"
          test -f "dist/$package/lib/builtin/contract.gom"
          test -f "dist/$package/lib/builtin/goml.toml"
          test -f "dist/$package/lib/builtin/runtime.gom"
          test -f "dist/$package/lib/builtin/impls.gom"
          test -f "dist/$package/lib/builtin/language.gom"
          test -f "dist/$package/lib/builtin/numeric.gom"
          test -f "dist/$package/lib/builtin/derive.gom"
          test -f "dist/$package/lib/prelude/prelude.gom"
          test -f "dist/$package/lib/prelude/goml.toml"
          test -f "dist/$package/lib/std/goml.toml"
          test ! -e "dist/$package/lib/compiler/compiler-world-v2.gaf"
          test "$(dist/$package/bin/goml version)" = "goml $RELEASE_VERSION"
          test "$(dist/$package/bin/gomlc version --format json | jq -r .version)" = "$RELEASE_VERSION"
          test "$(dist/$package/bin/gomlfmt --version)" = "gomlfmt $RELEASE_VERSION"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Smoke test release archive
        run: |
          set -euo pipefail
          package="goml-${RELEASE_VERSION}-linux-amd64"
          smoke_root="$(mktemp -d)"
          tar -xzf "dist/$package.tar.gz" -C "$smoke_root"
          test -f "$smoke_root/$package/lib/builtin/contract.gom"
          test -f "$smoke_root/$package/lib/builtin/goml.toml"
          test -f "$smoke_root/$package/lib/builtin/runtime.gom"
          test -f "$smoke_root/$package/lib/builtin/impls.gom"
          test -f "$smoke_root/$package/lib/builtin/language.gom"
          test -f "$smoke_root/$package/lib/builtin/numeric.gom"
          test -f "$smoke_root/$package/lib/builtin/derive.gom"
          test -f "$smoke_root/$package/lib/prelude/prelude.gom"
          test -f "$smoke_root/$package/lib/prelude/goml.toml"
          test -f "$smoke_root/$package/lib/std/goml.toml"
          test ! -e "$smoke_root/$package/lib/compiler/compiler-world-v2.gaf"
          cp -R tools/release/testdata/smoke "$smoke_root/project"
          cd "$smoke_root/project"
          "$smoke_root/$package/bin/goml" check
          "$smoke_root/$package/bin/goml" build
          test "$("$smoke_root/$package/bin/goml" run)" = "std/works"
          "$smoke_root/$package/bin/goml" test
          "$smoke_root/$package/bin/gomlfmt" -w ./*.gom
          "$smoke_root/$package/bin/gomlfmt" --check ./*.gom
          "$smoke_root/$package/bin/goml" fmt --check
          bash "$GITHUB_WORKSPACE/tools/release/lsp_smoke.sh" "$smoke_root/$package/bin/gomllsp" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: goml-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2>/dev/null || true)"
          if test "$release_state" = ""; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "goml $RELEASE_TAG" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS_TAG"
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
